version: 2
updates:
    # Keep the SHA-pinned GitHub Actions current. Dependabot follows the `# vX`
    # comment next to each pin and bumps both the SHA and the comment together.
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns:
                  - "*"

    # npm dependencies (includes the `overrides` pins that resolve security
    # advisories, e.g. postcss under next).
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          npm:
              patterns:
                  - "*"
      # TypeScript 7 is the native (Go) rewrite; its npm package drops the
      # classic compiler API from the package root, which Next's build-time
      # typecheck loads. Stay on 6.x until Next supports the new layout.
      ignore:
          - dependency-name: typescript
            update-types: ["version-update:semver-major"]
          # eslint-config-next 16 and its bundled plugins (import, react,
          # jsx-a11y) peer-support eslint 9 only; eslint 10 dropped the
          # scopeManager.addGlobals API they call, breaking `next lint`.
          # Stay on 9.x until eslint-config-next targets eslint 10.
          - dependency-name: eslint
            update-types: ["version-update:semver-major"]
          # vitest 5 declares `Assertion<R extends void | Promise<void>, T>`,
          # while @testing-library/jest-dom (7.0.1, latest) augments it as
          # `Assertion<T>`. Declaration merging across a differing type
          # parameter list is an error inside the .d.ts, which skipLibCheck
          # swallows, so the augmentation is dropped and every jest-dom matcher
          # disappears from the type surface while still working at runtime:
          # `vitest run` stays green and `next build` fails the typecheck on
          # 200+ assertions. Stay on 4.x until jest-dom augments the two-
          # parameter interface.
          - dependency-name: vitest
            update-types: ["version-update:semver-major"]

    # The Rust half of the tree is the half that terminates bytes off the
    # network - QUIC, TLS, DNS, the relay client - and it is 693 packages deep.
    # Nothing watched it before this entry: the advisory gate in ci.yml only runs
    # when a change lands, and an advisory opens without any change at all.
    - package-ecosystem: cargo
      directory: /src-tauri
      schedule:
          interval: weekly
      groups:
          cargo:
              patterns:
                  - "*"
      # `wmi` is held at an exact version by src-tauri/Cargo.toml, which explains
      # why: from 0.18.2 it asks for `windows` and `windows-core` as two
      # independent ranges that cargo settles differently in a tree holding both
      # tauri and iroh, and the build then fails on Windows only. CI checks the
      # shell on Linux, so a bump would look green here and break the release
      # build. Lifting the pin is the human decision that comment describes.
      ignore:
          - dependency-name: wmi
