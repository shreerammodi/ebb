name: Release desktop app

# Builds signed, cross-platform desktop installers and publishes them to a
# GitHub Release, along with the `latest.json` manifest the in-app updater
# reads. Triggered by pushing a version tag (e.g. `v0.2.0`), or by dispatching
# the workflow against an existing `v*` tag to rebuild one.
on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

# Every job below names the scope it needs, so a job added later starts with no
# token at all rather than inheriting write.
permissions: {}

jobs:
    release:
        strategy:
            fail-fast: false
            matrix:
                include:
                    # macOS universal (Apple Silicon + Intel)
                    - platform: macos-latest
                      args: "--target universal-apple-darwin"
                    # Linux x64
                    - platform: ubuntu-22.04
                      args: ""
                    # Windows x64
                    - platform: windows-latest
                      args: ""

        runs-on: ${{ matrix.platform }}
        # tauri-action creates the release and uploads the installers with this
        # job's token, so the job that runs npm install scripts and a build.rs
        # per crate is unavoidably the one that can write. Narrowing it further
        # means not using tauri-action.
        permissions:
            contents: write
        steps:
            # workflow_dispatch can be pointed at any ref. Everything below names
            # the release after `github.ref_name`, so a dispatch against a branch
            # would publish a release tagged `main`. Fail before that happens.
            - name: Require a version tag
              shell: bash
              run: |
                  case "$GITHUB_REF" in
                      refs/tags/v*) ;;
                      *) echo "release.yml must run on a v* tag, got $GITHUB_REF" >&2; exit 1 ;;
                  esac

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: npm

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
              with:
                  # Both Apple targets so the universal/per-arch builds resolve.
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Rust cache
              uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
              with:
                  workspaces: "./src-tauri -> target"

            # Linux build deps for the WebKitGTK webview and the AppImage bundler.
            - name: Install Linux dependencies
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    libssl-dev

            - name: Install npm dependencies
              run: npm ci

            - name: Build, sign, and publish
              uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Ed25519 updater signing — mandatory. Generate with
                  # `npm run tauri signer generate` and store these as repo secrets.
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  # OS code signing (deferred, ships unsigned beta builds). Do NOT wire
                  # the APPLE_* env vars from unset secrets: an unset secret becomes a
                  # defined-but-empty env var, and the bundler treats a *present*
                  # APPLE_CERTIFICATE as "sign me", then fails on `security import` with
                  # empty cert data. To enable Developer ID signing + notarization, add
                  # these env keys back here alongside their (non-empty) repo secrets:
                  #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
                  #   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
              with:
                  # tauri-action creates the release, builds per-platform installers,
                  # signs the updater artifacts, generates latest.json, and uploads all
                  # of it. The tag that triggered the run names the release.
                  tagName: ${{ github.ref_name }}
                  releaseName: "ebb ${{ github.ref_name }}"
                  # The changelog is pinned to the tag, not to main: linking main
                  # would show entries written after this release went out.
                  releaseBody: "See the assets below to download and run or install, and the [changelog](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for a log of updates."
                  # Every matrix job uploads into this one release, so it stays a draft
                  # until the last platform lands. The updater reads
                  # `releases/latest/download/latest.json` and a draft is never
                  # "latest", so a half-uploaded release is not an update anyone can
                  # take. The publish job below undrafts it.
                  releaseDraft: true
                  prerelease: false
                  uploadUpdaterJson: true
                  args: ${{ matrix.args }}

            - name: Upload portable Windows app
              if: matrix.platform == 'windows-latest'
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.ref_name }}
              run: |
                  version=$(node -p "require('./package.json').version")
                  portable="ebb_${version}_x64-portable.exe"
                  cp src-tauri/target/release/ebb.exe "$portable"
                  gh release upload "$TAG" "$portable" --repo "$GITHUB_REPOSITORY"

    # Runs only when every matrix platform built, so a release reaches users whole
    # or not at all. A failed platform leaves the draft in place for a human.
    publish:
        needs: release
        runs-on: ubuntu-22.04
        # Undrafts the release and force-updates the `release` branch.
        permissions:
            contents: write
        steps:
            - name: Publish the release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # A tag name reaches the shell as text, and git's ref rules
                  # permit `$`, backtick, `;`, and `&`. Read it as a variable so
                  # whoever can push a tag cannot also run a command here.
                  TAG: ${{ github.ref_name }}
              run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

            # Vercel's production branch is `release`, not `main`, so the web
            # build ships the same commit the desktop installers were cut from
            # and the version number means the same thing on both surfaces.
            # Moving it last means a release nobody could download never became
            # the live site.
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Point the release branch at this tag
              run: git push origin "+${{ github.sha }}:refs/heads/release"
