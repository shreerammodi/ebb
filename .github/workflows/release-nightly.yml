name: Nightly desktop build

# Builds unsigned, unversioned-in-name installers from the current tip of main
# and publishes them to a single rolling prerelease tagged `nightly`. This is
# the channel for people who want to run what is on main without building it
# themselves; it is not an update channel. Nightly builds carry no updater
# artifacts, so no nightly is ever served as an update to anyone - and because
# the updater endpoint stays pointed at the stable channel, an installed nightly
# moves on to the next tagged release.
on:
    push:
        branches: [main]
    workflow_dispatch:

# One nightly at a time. A newer push supersedes an in-flight build, because
# only the newest commit on main is worth having a nightly for.
concurrency:
    group: nightly
    cancel-in-progress: true

# Every job below names the scope it needs. The gate runs the test suite and npm
# install scripts and writes nothing, so it holds a read-only token; only the
# three jobs that touch the release can write.
permissions: {}

jobs:
    # The nightly is "what is on main and passing", so the gate runs against
    # the exact commit being bundled rather than trusting a separate CI run.
    gate:
        name: Test + lint
        runs-on: ubuntu-22.04
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci
            - run: npm test
            - run: npm run lint

    # Recreating the release (rather than adding to it) is what keeps a stale
    # Windows installer from a week ago sitting next to today's macOS one.
    prepare:
        needs: gate
        runs-on: ubuntu-22.04
        permissions:
            contents: write
        outputs:
            release_id: ${{ steps.recreate.outputs.release_id }}
        steps:
            - name: Recreate the nightly release
              id: recreate
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail

                  # --cleanup-tag drops the `nightly` git tag too, so the tag the
                  # new release creates points at this commit instead of an old one.
                  gh release delete nightly --yes --cleanup-tag \
                    --repo "$GITHUB_REPOSITORY" || true

                  body=$(cat <<EOF
                  This nightly release is automatically built and generated on every commit to main that passes tests.

                  > [!WARNING]
                  > **This is a nightly build, not a tagged release. We recommend using tagged releases; a nightly updates itself to the next tagged release rather than to a newer nightly.**
                  >
                  > For releases meant to be used in a round, please see the [ebb website](https://ebb.smodi.net).
                  EOF
                  )

                  # Born as a draft for the same reason a tagged release is: the
                  # three platforms upload independently and a half-populated
                  # nightly should not be downloadable.
                  id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
                    -f tag_name=nightly \
                    -f target_commitish="$GITHUB_SHA" \
                    -f name="ebb nightly" \
                    -f body="$body" \
                    -F draft=true \
                    -F prerelease=true \
                    --jq .id)

                  echo "release_id=$id" >> "$GITHUB_OUTPUT"

    build:
        needs: prepare
        strategy:
            fail-fast: false
            matrix:
                include:
                    # macOS universal (Apple Silicon + Intel)
                    - platform: macos-latest
                      args: "--target universal-apple-darwin"
                    # Linux x64
                    - platform: ubuntu-22.04
                      args: ""
                    # Windows x64
                    - platform: windows-latest
                      args: ""

        runs-on: ${{ matrix.platform }}
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: npm

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
              with:
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Rust cache
              uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
              with:
                  workspaces: "./src-tauri -> target"

            - name: Install Linux dependencies
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    libssl-dev

            - name: Install npm dependencies
              run: npm ci

            # tauri-action is deliberately not used here. It owns the upload, and
            # with it the asset names, which for a nightly are the whole point:
            # a rolling build must not ship files stamped with a release version
            # it is not. Building and uploading by hand also means the macOS
            # `.app` simply stays on the runner instead of being tarred into
            # something that looks like an update bundle.
            - name: Build
              shell: bash
              run: |
                  set -euo pipefail
                  # The Rust cache restores `target/`, and the upload below finds
                  # installers by extension rather than by name. A bundle left by
                  # an earlier run would now collide with this one instead of
                  # being overwritten, so the directory starts empty.
                  rm -rf src-tauri/target/release/bundle src-tauri/target/*/release/bundle
                  npm run tauri build -- --config src-tauri/tauri.nightly.conf.json ${{ matrix.args }}

            # Names carry the platform and nothing else, so a download URL under
            # the `nightly` tag is stable and a file on disk never claims to be a
            # release. Which commit a nightly came from is on the release page
            # and in the sha256 GitHub publishes beside every asset.
            - name: Upload without a version in the name
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
              run: |
                  set -euo pipefail
                  version=$(node -p "require('./package.json').version")
                  escaped=${version//./\\.}

                  found=0
                  while IFS= read -r file; do
                      name=$(basename "$file")
                      # `ebb_0.7.2_universal.dmg` -> `ebb_universal.dmg`, and the
                      # rpm's `name-version-release.arch` -> `ebb_x86_64.rpm`.
                      name=$(printf '%s' "$name" | sed -E "s/-${escaped}-[0-9]+\./_/; s/_${escaped}_/_/")
                      if [ "$name" = "$(basename "$file")" ]; then
                          echo "refusing to upload $name: the version was not in the name where expected" >&2
                          exit 1
                      fi
                      echo "$(basename "$file") -> $name"
                      curl -sSf -X POST \
                        -H "Authorization: Bearer $GH_TOKEN" \
                        -H "Content-Type: application/octet-stream" \
                        --data-binary @"$file" \
                        "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
                        -o /dev/null
                      found=$((found + 1))
                  done < <(find src-tauri/target -path '*/release/bundle/*' -type f \
                             \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \
                                -o -name '*.rpm' -o -name '*.exe' -o -name '*.msi' \) | sort)

                  if [ "${{ matrix.platform }}" = windows-latest ]; then
                    file=src-tauri/target/release/ebb.exe
                    name=ebb_x64-portable.exe
                    echo "$(basename "$file") -> $name"
                    curl -sSf -X POST \
                      -H "Authorization: Bearer $GH_TOKEN" \
                      -H "Content-Type: application/octet-stream" \
                      --data-binary @"$file" \
                      "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
                      -o /dev/null
                    found=$((found + 1))
                  fi

                  # A green build that shipped nothing is the failure this catches.
                  [ "$found" -gt 0 ] || { echo "no installers found under src-tauri/target" >&2; exit 1; }

    publish:
        needs: build
        runs-on: ubuntu-22.04
        permissions:
            contents: write
        steps:
            - name: Publish the nightly
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release edit nightly \
                    --draft=false \
                    --prerelease \
                    --repo "$GITHUB_REPOSITORY"
